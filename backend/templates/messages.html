{% extends "base.html" %}
{% block title %}Inbox — MoodleCloud{% endblock %}

{% block content %}
  <section class="card">
    <div class="header">
      <div>
        <h1 class="h1">Inbox</h1>
        <p class="muted">Boîte de réception (démo).</p>
      </div>
      <div class="header__actions">
        <a class="btn btn--ghost" href="{{ url_for('main.search', q='invoice') }}">Rechercher</a>
      </div>
    </div>

    <div class="listcard">
      {% for m in messages %}
        <a class="item" href="{{ url_for('main.message_detail', message_id=m.id) }}">
          <div>
            <div class="item__title">{{ m.subject }}</div>
            <div class="item__meta">{{ m.created_at }} — {{ m.sender }}</div>
          </div>
          <div class="item__right">Ouvrir →</div>
        </a>
      {% endfor %}
    </div>
  </section>
{% endblock %}
